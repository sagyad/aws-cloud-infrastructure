# -----------------------------------------------------------------------------
# CI/CD Pipeline — Project 04: Serverless API
# Deploys Lambda + API Gateway + DynamoDB via Terraform
# Trigger: Pull request (plan) | Push to main (apply)
# -----------------------------------------------------------------------------

name: "04 — Serverless API"

on:
  pull_request:
    branches: [main]
    paths: ["04-serverless-api/**"]
  push:
    branches: [main]
    paths: ["04-serverless-api/**"]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TF_VAR_db_password: ${{ secrets.TF_VAR_DB_PASSWORD }}

defaults:
  run:
    working-directory: 04-serverless-api/terraform

jobs:
  terraform:
    name: "Terraform"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      # --- Package Lambda before plan ---
      - name: Package Lambda
        run: |
          cd ../app
          zip -r ../terraform/lambda.zip main.py
          cd ../terraform

      - name: Terraform Plan
        run: terraform plan -var-file=environments/dev.tfvars -out=tfplan

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve tfplan

